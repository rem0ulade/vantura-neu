<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">Proud Together – gemeinsam, sicher, sichtbar</title><defs><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8f7e8"/><stop offset=".35" stop-color="#b8b2ef"/><stop offset=".75" stop-color="#f2a2cc"/><stop offset="1" stop-color="#b0e7d3"/></linearGradient><linearGradient id="mint"><stop stop-color="#b5f5df"/><stop offset="1" stop-color="#eb99c9"/></linearGradient></defs><rect width="1440" height="900" fill="#4521a5"/>
<g font-family="Arial,sans-serif"><g fill="white"><text x="80" y="81" font-size="25" font-weight="700">Proud Together</text><text x="80" y="103" font-size="9" letter-spacing="2" fill="#d7cef0">GEMEINSAM. SICHER. SICHTBAR.</text><g font-size="16" fill="#e5dff7"><text x="815" y="84">Über uns</text><text x="932" y="84">Projekte</text><text x="1040" y="84">Mitmachen</text></g></g><rect x="1190" y="51" width="165" height="52" rx="26" fill="#a6efd7"/><text x="1220" y="84" fill="#291063" font-size="16" font-weight="700">Jetzt helfen</text><path d="M80 135H1360" stroke="#ffffff30"/>
<text x="80" y="238" fill="#a6efd7" font-size="13" letter-spacing="2">PROUD TOGETHER · VEREIN IN GRÜNDUNG</text><g font-size="86" font-weight="700" letter-spacing="-5"><text x="75" y="365" fill="white">Du gehörst dazu.</text><text x="75" y="463" fill="#cbbbf3">Genau so,</text><text x="75" y="561" fill="#cbbbf3">wie du bist.</text></g><g font-size="20" fill="#d7cef0"><text x="80" y="630">Wir bauen einen Verein auf, der queere Menschen stärkt.</text><text x="80" y="667">Mit Unterstützung, Wissen und einer Community,</text><text x="80" y="704">die zusammenhält.</text></g><rect x="80" y="754" width="305" height="58" rx="29" fill="#a6efd7"/><text x="109" y="790" fill="#291063" font-size="17" font-weight="700">Gemeinsam etwas bewegen ↗</text><text x="425" y="790" fill="white" font-size="16">Mehr erfahren →</text>
