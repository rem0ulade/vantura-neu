  <text x="52" y="96" fill="#9aa3b2" font-family="Inter,Arial,sans-serif" font-size="16">Freitag · 3 Termine · Einkauf offen</text>
  <rect x="52" y="126" width="316" height="214" rx="18" fill="url(#familyGlow)" filter="url(#shadow)"/>
  <text x="78" y="172" fill="#211712" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Heute</text>
