  <text x="642" y="194" fill="#ffc96d" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Szene an</text>
  <rect x="620" y="246" width="186" height="94" rx="18" fill="#252a35" stroke="#343b49"/>
  <text x="642" y="280" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800">Medien</text>
  <rect x="642" y="304" width="118" height="14" rx="7" fill="#7ea7ff"/><circle cx="778" cy="311" r="14" fill="#f7efe4"/>
  <rect x="52" y="366" width="754" height="78" rx="18" fill="#222733" stroke="#343b49"/>
  <text x="78" y="412" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Alle sind unterwegs · Flurlicht aus · Haustür geschlossen</text>
