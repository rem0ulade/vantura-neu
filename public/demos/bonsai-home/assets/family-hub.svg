  <rect x="392" y="176" width="204" height="164" rx="18" fill="#222733" stroke="#343b49"/>
  <circle cx="420" cy="216" r="8" fill="#35d0c5"/><rect x="440" y="207" width="106" height="16" rx="8" fill="#d8dee8" opacity=".75"/>
  <circle cx="420" cy="254" r="8" fill="#35d0c5"/><rect x="440" y="245" width="132" height="16" rx="8" fill="#d8dee8" opacity=".6"/>
  <circle cx="420" cy="292" r="8" fill="#35d0c5"/><rect x="440" y="283" width="88" height="16" rx="8" fill="#d8dee8" opacity=".5"/>
  <rect x="620" y="126" width="186" height="94" rx="18" fill="#252a35" stroke="#343b49"/>
