<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">Family Hub Dashboard</title>
  <desc id="desc">Ein dunkles Smart-Home-Dashboard mit Familienkalender, Einkaufsliste, Räumen und Mediensteuerung.</desc>
  <defs>
    <linearGradient id="familyGlow" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffc96d"/>
      <stop offset="1" stop-color="#ff7d6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="880" height="500" rx="30" fill="#101218"/>
  <rect x="22" y="20" width="836" height="460" rx="24" fill="#171a22" stroke="#2d3340"/>
