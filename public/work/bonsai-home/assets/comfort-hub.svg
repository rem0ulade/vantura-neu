<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">Comfort Hub Dashboard</title>
  <desc id="desc">Ein dunkles Smart-Home-Dashboard mit Klima, Luftqualität, Schlafroutine und Musik.</desc>
  <defs>
    <linearGradient id="comfortGlow" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#35d0c5"/>
      <stop offset="1" stop-color="#7ea7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="880" height="500" rx="30" fill="#101218"/>
  <rect x="22" y="20" width="836" height="460" rx="24" fill="#171a22" stroke="#2d3340"/>
  <text x="52" y="66" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800">Comfort Mode</text>
  <text x="52" y="96" fill="#9aa3b2" font-family="Inter,Arial,sans-serif" font-size="16">Klima stabil · Luftqualität sehr gut</text>
  <rect x="52" y="126" width="278" height="214" rx="18" fill="url(#comfortGlow)" filter="url(#shadow)"/>
  <text x="84" y="184" fill="#09131b" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Schlafzimmer</text>
  <text x="84" y="250" fill="#09131b" font-family="Inter,Arial,sans-serif" font-size="74" font-weight="850">21°</text>
  <text x="90" y="294" fill="#09131b" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">leise kühlen</text>
  <rect x="360" y="126" width="212" height="214" rx="18" fill="#222733" stroke="#343b49"/>
  <text x="386" y="166" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Luft</text>
  <circle cx="466" cy="244" r="62" fill="none" stroke="#303846" stroke-width="18"/>
  <circle cx="466" cy="244" r="62" fill="none" stroke="#91d870" stroke-width="18" stroke-dasharray="322 390" stroke-linecap="round" transform="rotate(-90 466 244)"/>
  <text x="435" y="255" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="850">92</text>
  <rect x="602" y="126" width="204" height="94" rx="18" fill="#252a35" stroke="#343b49"/>
  <text x="626" y="162" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Schlafroutine</text>
  <rect x="626" y="184" width="118" height="12" rx="6" fill="#35d0c5"/>
  <rect x="602" y="246" width="204" height="94" rx="18" fill="#252a35" stroke="#343b49"/>
  <text x="626" y="282" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">Musik</text>
  <rect x="626" y="306" width="138" height="12" rx="6" fill="#7ea7ff"/>
  <rect x="52" y="366" width="754" height="78" rx="18" fill="#222733" stroke="#343b49"/>
  <text x="78" y="412" fill="#f7efe4" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800">Jalousien 72% · Warmes Licht · Nachtmodus bereit</text>
</svg>
